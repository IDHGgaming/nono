<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GraphX</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 20%, #172554, transparent 35%),
        radial-gradient(circle at 80% 80%, #312e81, transparent 35%),
        #050816;
    overflow-x: hidden;
}

/* Animated background */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(120deg,
            transparent,
            rgba(80,120,255,0.04),
            transparent);
    animation: backgroundMove 8s infinite linear;
    pointer-events: none;
}

@keyframes backgroundMove {
    0% {
        transform: translateX(-50%);
    }

    100% {
        transform: translateX(50%);
    }
}

header {
    text-align: center;
    padding: 35px 20px 20px;
}

.logo {
    font-size: 42px;
    font-weight: bold;

    background: linear-gradient(
        90deg,
        #60a5fa,
        #a78bfa,
        #22d3ee
    );

    -webkit-background-clip: text;
    color: transparent;

    text-shadow: 0 0 30px rgba(100,150,255,0.4);
}

.subtitle {
    color: #94a3b8;
    margin-top: 5px;
}

/* Glass panel */

.panel {
    width: min(1100px, 94%);
    margin: auto;

    padding: 20px;

    border-radius: 20px;

    background: rgba(15, 23, 42, 0.65);

    border: 1px solid rgba(255,255,255,0.1);

    backdrop-filter: blur(20px);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.4),
        inset 0 1px rgba(255,255,255,0.05);
}

/* Controls */

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

input {
    flex: 1;
    min-width: 250px;

    padding: 15px 18px;

    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);

    background: rgba(0,0,0,0.35);

    color: white;

    font-size: 18px;

    outline: none;

    transition: 0.3s;
}

input:focus {
    border-color: #60a5fa;

    box-shadow:
        0 0 20px rgba(96,165,250,0.25);
}

button {
    padding: 14px 22px;

    border: none;
    border-radius: 12px;

    background: linear-gradient(
        135deg,
        #3b82f6,
        #6366f1
    );

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.25s;

    box-shadow:
        0 0 20px rgba(59,130,246,0.25);
}

button:hover {
    transform: translateY(-2px) scale(1.03);

    box-shadow:
        0 0 30px rgba(59,130,246,0.5);
}

button:active {
    transform: scale(0.96);
}

/* Graph */

.graph-container {
    margin-top: 20px;

    position: relative;

    border-radius: 18px;

    overflow: hidden;

    border: 1px solid rgba(255,255,255,0.1);

    box-shadow:
        0 0 40px rgba(59,130,246,0.1);
}

canvas {
    display: block;

    width: 100%;

    background:
        radial-gradient(
            circle at center,
            #111827,
            #030712
        );
}

/* Coordinate display */

.coordinates {
    position: absolute;

    top: 12px;
    left: 12px;

    padding: 8px 12px;

    border-radius: 10px;

    background: rgba(0,0,0,0.5);

    backdrop-filter: blur(10px);

    color: #94a3b8;

    font-family: monospace;

    pointer-events: none;
}

/* Help */

.help {
    text-align: center;

    margin-top: 15px;

    color: #64748b;

    font-size: 14px;
}

/* Status */

.status {
    text-align: center;

    margin-top: 12px;

    color: #60a5fa;

    font-size: 14px;
}

@media(max-width:600px) {

    .logo {
        font-size: 32px;
    }

    input {
        min-width: 100%;
    }

    button {
        flex: 1;
    }
}

</style>
</head>

<body>

<header>

    <div class="logo">
        ✦ GraphX
    </div>

    <div class="subtitle">
        Interactive Function Grapher
    </div>

</header>


<div class="panel">

    <div class="controls">

        <input
            id="functionInput"
            value="x^2"
            placeholder="Enter a function..."
            autocomplete="off"
        >

        <button onclick="drawGraph()">
            ✦ Graph
        </button>

        <button onclick="zoomIn()">
            ＋ Zoom
        </button>

        <button onclick="zoomOut()">
            − Zoom
        </button>

        <button onclick="resetView()">
            ↻ Reset
        </button>

    </div>


    <div class="graph-container">

        <canvas
            id="canvas"
            width="1200"
            height="650">
        </canvas>

        <div
            class="coordinates"
            id="coordinates">
            x: 0.00 | y: 0.00
        </div>

    </div>


    <div class="status" id="status">
        Ready
    </div>


    <div class="help">
        Try: x^2 &nbsp; • &nbsp;
        sin(x) &nbsp; • &nbsp;
        cos(x) &nbsp; • &nbsp;
        x^3 - 2*x &nbsp; • &nbsp;
        1/x
    </div>

</div>


<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const input =
    document.getElementById("functionInput");

const coordinates =
    document.getElementById("coordinates");

const status =
    document.getElementById("status");


let scale = 50;

let offsetX = canvas.width / 2;
let offsetY = canvas.height / 2;

let mouseX = 0;
let mouseY = 0;


/* Convert function */

function prepareFunction(expression) {

    let e =
        expression.toLowerCase();

    e = e.replace(/\^/g, "**");

    e = e.replace(/\bpi\b/g, "Math.PI");
    e = e.replace(/\be\b/g, "Math.E");

    e = e.replace(/\bsin\b/g, "Math.sin");
    e = e.replace(/\bcos\b/g, "Math.cos");
    e = e.replace(/\btan\b/g, "Math.tan");

    e = e.replace(/\bsqrt\b/g, "Math.sqrt");
    e = e.replace(/\babs\b/g, "Math.abs");

    e = e.replace(/\blog\b/g, "Math.log10");
    e = e.replace(/\bln\b/g, "Math.log");

    e = e.replace(/\bexp\b/g, "Math.exp");

    return e;
}


/* Draw */

function drawGraph() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawGrid();

    let expression =
        input.value.trim();

    if (!expression)
        return;

    let func;

    try {

        const prepared =
            prepareFunction(expression);

        func =
            new Function(
                "x",
                "return " + prepared
            );

        func(0);

    }
    catch {

        status.textContent =
            "⚠ Invalid function";

        status.style.color =
            "#f87171";

        return;
    }


    status.textContent =
        "● Graphing: " + expression;

    status.style.color =
        "#60a5fa";


    /* Glow */

    ctx.save();

    ctx.shadowColor =
        "#38bdf8";

    ctx.shadowBlur = 18;

    ctx.strokeStyle =
        "#38bdf8";

    ctx.lineWidth = 4;

    ctx.beginPath();


    let previousY = null;

    for (
        let px = 0;
        px < canvas.width;
        px++
    ) {

        const x =
            (px - offsetX) / scale;

        let y;

        try {

            y = func(x);

        }
        catch {

            previousY = null;
            continue;

        }


        if (!Number.isFinite(y)) {

            previousY = null;
            continue;

        }


        const py =
            offsetY - y * scale;


        if (
            py < -10000 ||
            py > 10000
        ) {

            previousY = null;
            continue;

        }


        if (
            previousY === null ||
            Math.abs(py - previousY) > 100
        ) {

            ctx.moveTo(px, py);

        }
        else {

            ctx.lineTo(px, py);

        }

        previousY = py;

    }

    ctx.stroke();

    ctx.restore();


    /* Bright core */

    ctx.strokeStyle =
        "#e0f2fe";

    ctx.lineWidth = 1.2;

    ctx.beginPath();

    previousY = null;


    for (
        let px = 0;
        px < canvas.width;
        px++
    ) {

        const x =
            (px - offsetX) / scale;

        let y;

        try {
            y = func(x);
        }
        catch {
            previousY = null;
            continue;
        }

        if (!Number.isFinite(y)) {
            previousY = null;
            continue;
        }

        const py =
            offsetY - y * scale;

        if (
            previousY === null ||
            Math.abs(py - previousY) > 100
        ) {

            ctx.moveTo(px, py);

        }
        else {

            ctx.lineTo(px, py);

        }

        previousY = py;

    }

    ctx.stroke();

}


/* Grid */

function drawGrid() {

    ctx.fillStyle =
        "#030712";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Grid lines */

    ctx.lineWidth = 1;

    for (
        let x = offsetX % scale;
        x < canvas.width;
        x += scale
    ) {

        ctx.strokeStyle =
            "rgba(148,163,184,0.12)";

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);

        ctx.stroke();

    }


    for (
        let y = offsetY % scale;
        y < canvas.height;
        y += scale
    ) {

        ctx.strokeStyle =
            "rgba(148,163,184,0.12)";

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);

        ctx.stroke();

    }


    /* Axes */

    ctx.strokeStyle =
        "rgba(255,255,255,0.5)";

    ctx.lineWidth = 2;


    ctx.beginPath();

    ctx.moveTo(0,offsetY);
    ctx.lineTo(canvas.width,offsetY);

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(offsetX,0);
    ctx.lineTo(offsetX,canvas.height);

    ctx.stroke();


    /* Axis numbers */

    ctx.fillStyle =
        "#64748b";

    ctx.font =
        "12px monospace";


    for (
        let x = offsetX + scale;
        x < canvas.width;
        x += scale
    ) {

        let number =
            Math.round(
                (x-offsetX)/scale
            );

        ctx.fillText(
            number,
            x+4,
            offsetY-6
        );

    }


    for (
        let x = offsetX - scale;
        x > 0;
        x -= scale
    ) {

        let number =
            Math.round(
                (x-offsetX)/scale
            );

        ctx.fillText(
            number,
            x+4,
            offsetY-6
        );

    }

}


/* Zoom */

function zoomIn() {

    scale *= 1.3;

    drawGraph();

}


function zoomOut() {

    scale /= 1.3;

    drawGraph();

}


function resetView() {

    scale = 50;

    offsetX =
        canvas.width / 2;

    offsetY =
        canvas.height / 2;

    drawGraph();

}


/* Mouse coordinates */

canvas.addEventListener(
    "mousemove",
    function(event) {

        const rect =
            canvas.getBoundingClientRect();

        mouseX =
            (event.clientX - rect.left)
            * (canvas.width / rect.width);

        mouseY =
            (event.clientY - rect.top)
            * (canvas.height / rect.height);


        const x =
            (mouseX-offsetX)/scale;

        const y =
            (offsetY-mouseY)/scale;


        coordinates.textContent =
            "x: " +
            x.toFixed(2) +
            " | y: " +
            y.toFixed(2);

    }
);


/* Mouse wheel zoom */

canvas.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();

        if(event.deltaY < 0) {

            scale *= 1.1;

        }
        else {

            scale /= 1.1;

        }

        drawGraph();

    },
    { passive:false }
);


/* Enter key */

input.addEventListener(
    "keydown",
    function(event) {

        if(event.key === "Enter") {

            drawGraph();

        }

    }
);


/* Start */

drawGraph();

</script>

</body>
</html>
